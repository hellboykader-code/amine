  <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#2E5E8C"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1F3A5F" flood-opacity="0.16"/></filter>
</defs><rect width="900" height="440" fill="#FFFFFF"/><text x="40" y="42" font-size="22" fill="#1F3A5F" font-weight="700" text-anchor="start">Anatomie d'un firmware (partitions)</text><rect x="90" y="86" width="360" height="44" rx="8" fill="#B0C9E2" stroke="#2E5E8C" stroke-width="1"/><text x="106" y="114" font-size="14" fill="#1F3A5F" font-weight="700" text-anchor="start">Bootloader</text><line x1="450" y1="108" x2="480" y2="108" stroke="#D0D9E4" stroke-width="1.2"/><text x="490" y="114" font-size="12.5" fill="#243342" font-weight="400" text-anchor="start">Démarre l'appareil, vérifie la signature</text><rect x="90" y="140" width="360" height="44" rx="8" fill="#9BBBD9" stroke="#2E5E8C" stroke-width="1"/><text x="106" y="168" font-size="14" fill="#1F3A5F" font-weight="700" text-anchor="start">Boot / Kernel</text><line x1="450" y1="162" x2="480" y2="162" stroke="#D0D9E4" stroke-width="1.2"/><text x="490" y="168" font-size="12.5" fill="#243342" font-weight="400" text-anchor="start">Noyau du système</text><rect x="90" y="194" width="360" height="44" rx="8" fill="#86AACF" stroke="#2E5E8C" stroke-width="1"/><text x="106" y="222" font-size="14" fill="#1F3A5F" font-weight="700" text-anchor="start">System / Super</text><line x1="450" y1="216" x2="480" y2="216" stroke="#D0D9E4" stroke-width="1.2"/><text x="490" y="222" font-size="12.5" fill="#243342" font-weight="400" text-anchor="start">Le système d'exploitation lui-même</text><rect x="90" y="248" width="360" height="44" rx="8" fill="#C7DAEC" stroke="#2E5E8C" stroke-width="1"/><text x="106" y="276" font-size="14" fill="#1F3A5F" font-weight="700" text-anchor="start">Recovery</text><line x1="450" y1="270" x2="480" y2="270" stroke="#D0D9E4" stroke-width="1.2"/><text x="490" y="276" font-size="12.5" fill="#243342" font-weight="400" text-anchor="start">Mode de maintenance / restauration</text><rect x="90" y="302" width="360" height="44" rx="8" fill="#DCE7F2" stroke="#2E5E8C" stroke-width="1"/><text x="106" y="330" font-size="14" fill="#1F3A5F" font-weight="700" text-anchor="start">Modem / Baseband</text><line x1="450" y1="324" x2="480" y2="324" stroke="#D0D9E4" stroke-width="1.2"/><text x="490" y="330" font-size="12.5" fill="#243342" font-weight="400" text-anchor="start">Gère le réseau mobile (lié à l'IMEI)</text><rect x="90" y="356" width="360" height="44" rx="8" fill="#F0D6D2" stroke="#2E5E8C" stroke-width="1"/><text x="106" y="384" font-size="14" fill="#1F3A5F" font-weight="700" text-anchor="start">Userdata</text><line x1="450" y1="378" x2="480" y2="378" stroke="#D0D9E4" stroke-width="1.2"/><text x="490" y="384" font-size="12.5" fill="#243342" font-weight="400" text-anchor="start">Vos données personnelles (effacées au flash complet)</text><text x="90" y="424" font-size="12.5" fill="#6B7684" font-weight="400" text-anchor="start" font-style="italic">Un « flash complet » réécrit tout ; un flash partiel ne touche que certaines partitions.</text></svg>