<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica Neue, Arial, sans-serif"><defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#2E5E8C"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1F3A5F" flood-opacity="0.16"/></filter>
</defs><rect width="900" height="300" fill="#FFFFFF"/><text x="450" y="40" font-size="21" fill="#1F3A5F" font-weight="700" text-anchor="middle">Chaîne de démarrage sécurisée (où agit un flash)</text><rect x="65" y="110" width="170" height="86" rx="10" fill="#EAF2FB" filter="url(#sh)"/><text x="150" y="148" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="middle">BootROM</text><text x="150" y="172" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="middle" font-style="italic">gravé, inviolable</text><line x1="235" y1="153" x2="262" y2="153" stroke="#2E5E8C" stroke-width="2.4" marker-end="url(#arr)"/><rect x="265" y="110" width="170" height="86" rx="10" fill="#EAF2FB" filter="url(#sh)"/><text x="350" y="148" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="middle">Bootloader</text><text x="350" y="172" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="middle" font-style="italic">vérifie la signature</text><line x1="435" y1="153" x2="462" y2="153" stroke="#2E5E8C" stroke-width="2.4" marker-end="url(#arr)"/><rect x="465" y="110" width="170" height="86" rx="10" fill="#EAF2FB" filter="url(#sh)"/><text x="550" y="148" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="middle">Boot / Kernel</text><text x="550" y="172" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="middle" font-style="italic">charge le noyau</text><line x1="635" y1="153" x2="662" y2="153" stroke="#2E5E8C" stroke-width="2.4" marker-end="url(#arr)"/><rect x="665" y="110" width="170" height="86" rx="10" fill="#EAF2FB" filter="url(#sh)"/><text x="750" y="148" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="middle">Système</text><text x="750" y="172" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="middle" font-style="italic">OS complet</text><text x="450" y="250" font-size="13" fill="#6B7684" font-weight="400" text-anchor="middle" font-style="italic">Le « secure boot » vérifie chaque étape : un firmware non signé est refusé.</text></svg>