</defs><rect width="900" height="430" fill="#FFFFFF"/><text x="450" y="40" font-size="22" fill="#1F3A5F" font-weight="700" text-anchor="middle">Appareil bloqué (bootloop / brick) — que faire ?</text><rect x="340" y="80" width="360" height="52" rx="10" fill="#EAF2FB" filter="url(#sh)"/><rect x="340" y="80" width="8" height="52" rx="4" fill="#2E5E8C"/><text x="362" y="102" font-size="13" fill="#243342" font-weight="600" text-anchor="start"><tspan x="362" dy="0">L'appareil réagit-il (logo, vibration) ?</tspan></text><text x="320" y="110" font-size="12" fill="#6B7684" font-weight="400" text-anchor="end" font-style="italic">diagnostic</text><line x1="520" y1="132" x2="520" y2="142" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="340" y="144" width="360" height="52" rx="10" fill="#EAF2FB" filter="url(#sh)"/><rect x="340" y="144" width="8" height="52" rx="4" fill="#2E5E8C"/><text x="362" y="166" font-size="13" fill="#243342" font-weight="600" text-anchor="start"><tspan x="362" dy="0">Oui → entrer en mode Recovery/Download</tspan></text><text x="320" y="174" font-size="12" fill="#6B7684" font-weight="400" text-anchor="end" font-style="italic">combinaison de touches</text><line x1="520" y1="196" x2="520" y2="206" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="340" y="208" width="360" height="52" rx="10" fill="#EAF7EE" filter="url(#sh)"/><rect x="340" y="208" width="8" height="52" rx="4" fill="#27AE60"/><text x="362" y="230" font-size="13" fill="#243342" font-weight="600" text-anchor="start"><tspan x="362" dy="0">Tenter une restauration officielle (bon firmware)</tspan></text><text x="320" y="238" font-size="12" fill="#6B7684" font-weight="400" text-anchor="end" font-style="italic">souvent suffisant</text><line x1="520" y1="260" x2="520" y2="270" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="340" y="272" width="360" height="52" rx="10" fill="#FCF3E4" filter="url(#sh)"/><rect x="340" y="272" width="8" height="52" rx="4" fill="#E8A13A"/><text x="362" y="294" font-size="13" fill="#243342" font-weight="600" text-anchor="start"><tspan x="362" dy="0">Écran noir total → mode bas niveau (EDL/DFU)</tspan></text><text x="320" y="302" font-size="12" fill="#6B7684" font-weight="400" text-anchor="end" font-style="italic">pilotes + outil</text><line x1="520" y1="324" x2="520" y2="334" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="340" y="336" width="360" height="52" rx="10" fill="#FDECEA" filter="url(#sh)"/><rect x="340" y="336" width="8" height="52" rx="4" fill="#C0392B"/><text x="362" y="358" font-size="13" fill="#243342" font-weight="600" text-anchor="start"><tspan x="362" dy="0">Toujours mort → problème matériel / test point</tspan></text><text x="320" y="366" font-size="12" fill="#6B7684" font-weight="400" text-anchor="end" font-style="italic">niveau avancé</text></svg>