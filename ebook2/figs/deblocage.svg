<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Helvetica Neue, Arial, sans-serif"><defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#2E5E8C"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1F3A5F" flood-opacity="0.16"/></filter>
</defs><rect width="900" height="380" fill="#FFFFFF"/><text x="450" y="40" font-size="21" fill="#1F3A5F" font-weight="700" text-anchor="middle">Déblocage réseau (désimlockage) : ce qui est permis</text><rect x="70" y="80" width="380" height="250" rx="14" fill="#EAF7EE" filter="url(#sh)"/><rect x="70" y="80" width="380" height="46" rx="14" fill="#27AE60"/><rect x="70" y="112" width="380" height="14" fill="#27AE60"/><text x="94" y="110" font-size="16" fill="#fff" font-weight="800" text-anchor="start">Légal</text><text x="94" y="155" font-size="17" font-weight="800" fill="#27AE60">✓</text><text x="118" y="150" font-size="12.5" fill="#243342" font-weight="600" text-anchor="start"><tspan x="118" dy="0">Code de déblocage de l'opérateur</tspan></text><text x="94" y="199" font-size="17" font-weight="800" fill="#27AE60">✓</text><text x="118" y="194" font-size="12.5" fill="#243342" font-weight="600" text-anchor="start"><tspan x="118" dy="0">Service de désimlockage officiel (par IMEI)</tspan></text><text x="94" y="243" font-size="17" font-weight="800" fill="#27AE60">✓</text><text x="118" y="238" font-size="12.5" fill="#243342" font-weight="600" text-anchor="start"><tspan x="118" dy="0">Appareil dont la propriété est prouvée</tspan></text><text x="94" y="287" font-size="17" font-weight="800" fill="#27AE60">✓</text><text x="118" y="282" font-size="12.5" fill="#243342" font-weight="600" text-anchor="start"><tspan x="118" dy="0">Passage à l'eSIM / opérateur compatible</tspan></text><rect x="470" y="80" width="380" height="250" rx="14" fill="#FDECEA" filter="url(#sh)"/><rect x="470" y="80" width="380" height="46" rx="14" fill="#C0392B"/><rect x="470" y="112" width="380" height="14" fill="#C0392B"/><text x="494" y="110" font-size="16" fill="#fff" font-weight="800" text-anchor="start">Interdit</text><text x="494" y="155" font-size="17" font-weight="800" fill="#C0392B">✕</text><text x="518" y="150" font-size="12.5" fill="#243342" font-weight="600" text-anchor="start"><tspan x="518" dy="0">Contourner un verrou de compte (iCloud/FRP)</tspan></text><text x="494" y="199" font-size="17" font-weight="800" fill="#C0392B">✕</text><text x="518" y="194" font-size="12.5" fill="#243342" font-weight="600" text-anchor="start"><tspan x="518" dy="0">Modifier l'IMEI d'un appareil</tspan></text><text x="494" y="243" font-size="17" font-weight="800" fill="#C0392B">✕</text><text x="518" y="238" font-size="12.5" fill="#243342" font-weight="600" text-anchor="start"><tspan x="518" dy="0">Débloquer un appareil signalé volé/perdu</tspan></text><text x="494" y="287" font-size="17" font-weight="800" fill="#C0392B">✕</text><text x="518" y="282" font-size="12.5" fill="#243342" font-weight="600" text-anchor="start"><tspan x="518" dy="0">Retirer un verrou d'entreprise (MDM)</tspan></text><text x="450" y="364" font-size="12.5" fill="#6B7684" font-weight="400" text-anchor="middle" font-style="italic">En cas de doute sur la provenance d'un appareil : refuser.</text></svg>