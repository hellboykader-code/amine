</defs><rect width="900" height="300" fill="#FFFFFF"/><text x="450" y="40" font-size="22" fill="#1F3A5F" font-weight="700" text-anchor="middle">Le processus de flashage sécurisé</text><rect x="51" y="104" width="118" height="92" rx="10" fill="#EAF2FB" filter="url(#sh)"/><circle cx="75" cy="130" r="16" fill="#2E5E8C"/><text x="75" y="135" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="97" y="135" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="start">Sauvegarder</text><text x="65" y="162" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="65" dy="0">les données</tspan></text><line x1="169" y1="150" x2="184" y2="150" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="187" y="104" width="118" height="92" rx="10" fill="#EAF2FB" filter="url(#sh)"/><circle cx="211" cy="130" r="16" fill="#2E5E8C"/><text x="211" y="135" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="233" y="135" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="start">Identifier</text><text x="201" y="162" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="201" dy="0">modèle exact</tspan></text><line x1="305" y1="150" x2="320" y2="150" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="323" y="104" width="118" height="92" rx="10" fill="#EAF2FB" filter="url(#sh)"/><circle cx="347" cy="130" r="16" fill="#2E5E8C"/><text x="347" y="135" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="369" y="135" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="start">Bon firmware</text><text x="337" y="162" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="337" dy="0">officiel + région</tspan></text><line x1="441" y1="150" x2="456" y2="150" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="459" y="104" width="118" height="92" rx="10" fill="#EAF2FB" filter="url(#sh)"/><circle cx="483" cy="130" r="16" fill="#2E5E8C"/><text x="483" y="135" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">4</text><text x="505" y="135" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="start">Bon mode</text><text x="473" y="162" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="473" dy="0">DFU/Odin/Fastboot</tspan></text><line x1="577" y1="150" x2="592" y2="150" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="595" y="104" width="118" height="92" rx="10" fill="#EAF2FB" filter="url(#sh)"/><circle cx="619" cy="130" r="16" fill="#2E5E8C"/><text x="619" y="135" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">5</text><text x="641" y="135" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="start">Flasher</text><text x="609" y="162" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="609" dy="0">sans débrancher</tspan></text><line x1="713" y1="150" x2="728" y2="150" stroke="#2E5E8C" stroke-width="2.2" marker-end="url(#arr)"/><rect x="731" y="104" width="118" height="92" rx="10" fill="#EAF7EE" filter="url(#sh)"/><circle cx="755" cy="130" r="16" fill="#27AE60"/><text x="755" y="135" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">6</text><text x="777" y="135" font-size="13" fill="#1F3A5F" font-weight="700" text-anchor="start">Vérifier</text><text x="745" y="162" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="745" dy="0">et reconfigurer</tspan></text><text x="450" y="250" font-size="13" fill="#C0392B" font-weight="400" text-anchor="middle" font-style="italic">La sauvegarde n'est PAS optionnelle : un flash complet efface les données.</text></svg>