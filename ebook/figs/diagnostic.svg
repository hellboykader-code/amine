    </filter>
  </defs><rect x="0" y="0" width="900" height="430" fill="#FFFFFF"/><text x="450" y="40" font-size="22" fill="#1F3A5F" font-weight="700" text-anchor="middle">La méthode de diagnostic en 7 étapes</text><rect x="26" y="76" width="200" height="96" rx="12" fill="#EAF2FB" filter="url(#sh)"/><circle cx="56" cy="106" r="19" fill="#2E5E8C"/><text x="56" y="113" font-size="21" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text><text x="84" y="106" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Historique</text><text x="42" y="138" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="42" dy="0">Interroger le client : chute ? liquide ?</tspan></text><rect x="242" y="76" width="200" height="96" rx="12" fill="#EAF2FB" filter="url(#sh)"/><circle cx="272" cy="106" r="19" fill="#2E5E8C"/><text x="272" y="113" font-size="21" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text><text x="300" y="106" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Inspection</text><text x="258" y="138" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="258" dy="0">Visuel avant / après ouverture</tspan></text><rect x="458" y="76" width="200" height="96" rx="12" fill="#EAF2FB" filter="url(#sh)"/><circle cx="488" cy="106" r="19" fill="#2E5E8C"/><text x="488" y="113" font-size="21" fill="#FFFFFF" font-weight="800" text-anchor="middle">3</text><text x="516" y="106" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Reproduire</text><text x="474" y="138" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="474" dy="0">Constater le symptôme soi-même</tspan></text><rect x="674" y="76" width="200" height="96" rx="12" fill="#EAF2FB" filter="url(#sh)"/><circle cx="704" cy="106" r="19" fill="#2E5E8C"/><text x="704" y="113" font-size="21" fill="#FFFFFF" font-weight="800" text-anchor="middle">4</text><text x="732" y="106" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Hypothèses</text><text x="690" y="138" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="690" dy="0">Du plus probable au plus rare</tspan></text><rect x="674" y="206" width="200" height="96" rx="12" fill="#EAF2FB" filter="url(#sh)"/><circle cx="704" cy="236" r="19" fill="#2E5E8C"/><text x="704" y="243" font-size="21" fill="#FFFFFF" font-weight="800" text-anchor="middle">5</text><text x="732" y="236" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Tester</text><text x="690" y="268" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="690" dy="0">Isoler : une variable à la fois</tspan></text><rect x="458" y="206" width="200" height="96" rx="12" fill="#EAF2FB" filter="url(#sh)"/><circle cx="488" cy="236" r="19" fill="#2E5E8C"/><text x="488" y="243" font-size="21" fill="#FFFFFF" font-weight="800" text-anchor="middle">6</text><text x="516" y="236" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Réparer</text><text x="474" y="268" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="474" dy="0">La cause, pas le symptôme</tspan></text><rect x="242" y="206" width="200" height="96" rx="12" fill="#EAF7EE" filter="url(#sh)"/><circle cx="272" cy="236" r="19" fill="#27AE60"/><text x="272" y="243" font-size="21" fill="#FFFFFF" font-weight="800" text-anchor="middle">7</text><text x="300" y="236" font-size="15.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Valider</text><text x="258" y="268" font-size="11.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="258" dy="0">Tester TOUTES les fonctions</tspan></text><line x1="226" y1="106" x2="239" y2="106" stroke="#2E5E8C" stroke-width="2" marker-end="url(#arr)"/><line x1="442" y1="106" x2="455" y2="106" stroke="#2E5E8C" stroke-width="2" marker-end="url(#arr)"/><line x1="658" y1="106" x2="671" y2="106" stroke="#2E5E8C" stroke-width="2" marker-end="url(#arr)"/><line x1="774" y1="172" x2="774" y2="203" stroke="#2E5E8C" stroke-width="2" marker-end="url(#arr)"/><line x1="674" y1="236" x2="677" y2="236" stroke="#2E5E8C" stroke-width="2" marker-end="url(#arr)" transform="rotate(180 674 236)"/><line x1="458" y1="236" x2="461" y2="236" stroke="#2E5E8C" stroke-width="2" marker-end="url(#arr)" transform="rotate(180 458 236)"/><line x1="242" y1="236" x2="245" y2="236" stroke="#2E5E8C" stroke-width="2" marker-end="url(#arr)" transform="rotate(180 242 236)"/></svg>