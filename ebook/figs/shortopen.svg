    </filter>
  </defs><rect x="0" y="0" width="900" height="380" fill="#FFFFFF"/><text x="450" y="40" font-size="22" fill="#1F3A5F" font-weight="700" text-anchor="middle">Les deux ennemis : court-circuit &amp; circuit ouvert</text><rect x="70" y="74" width="360" height="250" rx="14" fill="#FDECEA" filter="url(#sh)"/><rect x="70" y="74" width="360" height="40" rx="14" fill="#C0392B"/><rect x="70" y="100" width="360" height="14" fill="#C0392B"/><text x="250" y="101" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Court-circuit (short)</text><text x="110" y="204" font-size="20" fill="#243342" font-weight="800" text-anchor="start">+</text><line x1="128" y1="183" x2="128" y2="215" stroke="#243342" stroke-width="3"/><line x1="140" y1="190" x2="140" y2="208" stroke="#243342" stroke-width="3"/><path d="M140 183 L140 154 L360 154 L360 244" fill="none" stroke="#243342" stroke-width="2.5"/><path d="M360 244 L250 244" fill="none" stroke="#243342" stroke-width="2.5"/><path d="M250 154 L250 244 L140 244 L140 215" fill="none" stroke="#C0392B" stroke-width="3.5"/><circle cx="250" cy="244" r="7" fill="#C0392B"/><text x="266" y="236" font-size="12.5" fill="#C0392B" font-weight="700" text-anchor="start">→ chauffe</text><text x="250" y="302" font-size="13" fill="#C0392B" font-weight="700" text-anchor="middle">Résistance ≈ 0 Ω vers la masse</text><rect x="470" y="74" width="360" height="250" rx="14" fill="#F4F7FB" filter="url(#sh)"/><rect x="470" y="74" width="360" height="40" rx="14" fill="#6B7684"/><rect x="470" y="100" width="360" height="14" fill="#6B7684"/><text x="650" y="101" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Circuit ouvert (open)</text><text x="510" y="204" font-size="20" fill="#243342" font-weight="800" text-anchor="start">+</text><line x1="528" y1="183" x2="528" y2="215" stroke="#243342" stroke-width="3"/><line x1="540" y1="190" x2="540" y2="208" stroke="#243342" stroke-width="3"/><path d="M540 183 L540 154 L760 154 L760 244" fill="none" stroke="#243342" stroke-width="2.5"/><path d="M760 244 L680 244" fill="none" stroke="#243342" stroke-width="2.5"/><path d="M540 215 L540 244 L620 244" fill="none" stroke="#243342" stroke-width="2.5"/><line x1="620" y1="233" x2="620" y2="255" stroke="#6B7684" stroke-width="2.5"/><line x1="680" y1="233" x2="680" y2="255" stroke="#6B7684" stroke-width="2.5"/><text x="650" y="274" font-size="12.5" fill="#6B7684" font-weight="700" text-anchor="middle">coupure</text><text x="650" y="302" font-size="13" fill="#6B7684" font-weight="700" text-anchor="middle">Continuité perdue (résistance ∞)</text><text x="450" y="356" font-size="12.5" fill="#6B7684" font-weight="400" text-anchor="middle" font-style="italic">90 % des pannes matérielles se ramènent à l'une de ces deux situations — à mesurer au multimètre.</text></svg>