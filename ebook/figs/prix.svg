  </defs><rect x="0" y="0" width="900" height="380" fill="#FFFFFF"/><text x="450" y="40" font-size="22" fill="#1F3A5F" font-weight="700" text-anchor="middle">Comment se construit le prix d'une intervention</text><rect x="120" y="90" width="150" height="70" fill="#4A90C2"/><text x="195" y="130" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Coût pièce</text><rect x="120" y="160" width="150" height="80" fill="#E8A13A"/><text x="195" y="205" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Main-d'œuvre</text><rect x="120" y="240" width="150" height="70" fill="#27AE60"/><text x="195" y="280" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Marge / frais</text><rect x="120" y="90" width="150" height="220" fill="none" stroke="#1F3A5F" stroke-width="2" rx="6"/><line x1="290" y1="90" x2="290" y2="310" stroke="#1F3A5F" stroke-width="1.5"/><text x="304" y="205" font-size="16" fill="#1F3A5F" font-weight="800" text-anchor="start">= Prix client</text><rect x="520" y="96" width="320" height="54" rx="8" fill="#F4F7FB" stroke="#D0D9E4" stroke-width="1.5" filter="url(#sh)"/><rect x="520" y="96" width="6" height="54" rx="3" fill="#C0392B"/><text x="538" y="118" font-size="13.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Facturez le diagnostic</text><text x="538" y="136" font-size="11" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="538" dy="0">Déductible si la réparation est acceptée. Valorise votre temps.</tspan></text><rect x="520" y="160" width="320" height="54" rx="8" fill="#F4F7FB" stroke="#D0D9E4" stroke-width="1.5" filter="url(#sh)"/><rect x="520" y="160" width="6" height="54" rx="3" fill="#C0392B"/><text x="538" y="182" font-size="13.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Proposez des niveaux</text><text x="538" y="200" font-size="11" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="538" dy="0">Pièce d'origine vs compatible : prix et garanties différents.</tspan></text><rect x="520" y="224" width="320" height="54" rx="8" fill="#F4F7FB" stroke="#D0D9E4" stroke-width="1.5" filter="url(#sh)"/><rect x="520" y="224" width="6" height="54" rx="3" fill="#C0392B"/><text x="538" y="246" font-size="13.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Micro-soudure = premium</text><text x="538" y="264" font-size="11" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="538" dy="0">Peu de concurrents, forte valeur ajoutée.</tspan></text><rect x="520" y="288" width="320" height="54" rx="8" fill="#F4F7FB" stroke="#D0D9E4" stroke-width="1.5" filter="url(#sh)"/><rect x="520" y="288" width="6" height="54" rx="3" fill="#C0392B"/><text x="538" y="310" font-size="13.5" fill="#1F3A5F" font-weight="700" text-anchor="start">Soignez chaque réparation</text><text x="538" y="328" font-size="11" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="538" dy="0">Une casse au montage mange la marge de plusieurs autres.</tspan></text></svg>