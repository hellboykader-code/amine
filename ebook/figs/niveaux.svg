<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Helvetica Neue, Arial, sans-serif"><defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2E5E8C"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#27AE60"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1F3A5F" flood-opacity="0.16"/>
    </filter>
  </defs><rect x="0" y="0" width="900" height="430" fill="#FFFFFF"/><text x="450" y="42" font-size="22" fill="#1F3A5F" font-weight="700" text-anchor="middle">Les 3 niveaux d'intervention</text><rect x="40" y="90" width="820" height="86" rx="12" fill="#EAF2FB" filter="url(#sh)"/><rect x="40" y="90" width="10" height="86" rx="5" fill="#4A90C2"/><circle cx="92" cy="133" r="26" fill="#4A90C2"/><text x="92" y="142" font-size="30" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text><text x="132" y="124" font-size="16" fill="#1F3A5F" font-weight="700" text-anchor="start">Remplacement de modules (sans soudure)</text><text x="132" y="146" font-size="12.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="132" dy="0">Écran, batterie, connecteurs sur nappe — 80 à 90 % de l'activité. Point de départ de tous.</tspan></text><rect x="130" y="200" width="640" height="86" rx="12" fill="#FCF3E4" filter="url(#sh)"/><rect x="130" y="200" width="10" height="86" rx="5" fill="#E8A13A"/><circle cx="182" cy="243" r="26" fill="#E8A13A"/><text x="182" y="252" font-size="30" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text><text x="222" y="234" font-size="16" fill="#1F3A5F" font-weight="700" text-anchor="start">Micro-soudure de composants</text><text x="222" y="256" font-size="12.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="222" dy="0">Réparation de la carte mère : connecteurs soudés, puces de charge, pistes. Marges élevées.</tspan></text><rect x="220" y="310" width="460" height="86" rx="12" fill="#FDECEA" filter="url(#sh)"/><rect x="220" y="310" width="10" height="86" rx="5" fill="#C0392B"/><circle cx="272" cy="353" r="26" fill="#C0392B"/><text x="272" y="362" font-size="30" fill="#FFFFFF" font-weight="800" text-anchor="middle">3</text><text x="312" y="344" font-size="16" fill="#1F3A5F" font-weight="700" text-anchor="start">Reballing &amp; reprogrammation</text><text x="312" y="366" font-size="12.5" fill="#6B7684" font-weight="400" text-anchor="start"><tspan x="312" dy="0">BGA, EEPROM, récupération NAND. Très spécialisé, clientèle souvent inter-pro.</tspan></text><text x="450" y="410" font-size="12.5" fill="#6B7684" font-weight="400" text-anchor="middle" font-style="italic">Marge et rareté croissantes  →  vers le haut de la chaîne de valeur</text></svg>