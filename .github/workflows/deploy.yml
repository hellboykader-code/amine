name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/role-french-language-0sj136]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-gh
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publie le site vitrine statique (copie Framer adaptée MK Phone) sur gh-pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mkphone-framer
          publish_branch: gh-pages
